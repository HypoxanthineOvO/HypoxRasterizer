[project]
name = "hypo-rasterizer-tools"
version = "0.1.0"
description = "Python tooling for HypoxRasterizer validation assets and visualization"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.2.0",
]

[project.scripts]
hypo-fetch-scenes = "hypo_assets.fetch_scenes:main"
hypo-collect-stats = "hypo_validation.collect_stats:main"
hypo-compare-baseline = "hypo_validation.compare_baseline:main"
hypo-viz = "hypo_viz.render_2d:main"
hypo-viz-3d-static = "hypo_viz.render_3d_static:main"
hypo-viz-3d = "hypo_viz.viewer3d:main"
hypo-viz-3d-report = "hypo_viz.report3d:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hypo_assets", "hypo_validation", "hypo_viz"]
