version: 1

proxy:
  approved_ports: [7890, 7891, 7892]

scenes:
  - id: fast_empty_scene
    tier: fast
    config: configs/validation/fast/empty_scene.v2.json
    default: true
    tags: [fast, corner_case, empty, gbuffer]
    assets: []
    expected_outputs: [color, gbuffer]
    runtime_budget_seconds: 2
    source_type: internal
    license: project

  - id: fast_offscreen_triangle
